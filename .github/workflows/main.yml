YAML

name: Build StreamBox IPTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project packages
        run: npm install

      - name: Build website
        run: npm run build

      - name: Create Android configuration
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            npx cap init "StreamBox IPTV" "com.streambox.iptv" --web-dir dist
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android tools
        uses: android-actions/setup-android@v3

      - name: Create Android app
        run: npx cap add android

      - name: Prepare Android app
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamBox-IPTV-APK
          path: android/app/build/outputs/apk/debug/*.apk
